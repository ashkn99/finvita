<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquarium Health Helper</title>
  <meta name="description" content="Answer a few quick questions about your fish, water, or plants and get a likely diagnosis plus specific product recommendations.">
  <link rel="canonical" href="https://finvita.online/">
  <meta property="og:title" content="Aquarium Health Helper">
  <meta property="og:description" content="Answer a few quick questions about your fish, water, or plants and get a likely diagnosis plus specific product recommendations.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://finvita.online/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="logo">finvita</div>
    </div>

    <div class="hero">
      <div class="hero-glow"></div>
      <div class="hero-badge">Quick diagnosis</div>
      <h1>What's worrying<br>you today?</h1>
      <p>Answer a few quick questions and we'll help figure out what's going on.</p>
    </div>

    <div class="cards">
      <a class="card" href="diagnose-fish.html">
        <div class="tile">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M6 24c6-9 16-13 24-13 6 0 10 4 12 13-2 9-6 13-12 13-8 0-18-4-24-13z"/><path d="M30 24l10-7v14z"/></svg>
        </div>
        <div>
          <div class="card-label">My Fish</div>
          <div class="card-sub">Symptoms, behavior, illness</div>
        </div>
        <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
      </a>
      <a class="card" href="diagnose-water.html">
        <div class="tile">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M24 6c8 10 14 18 14 25a14 14 0 01-28 0c0-7 6-15 14-25z"/></svg>
        </div>
        <div>
          <div class="card-label">My Water</div>
          <div class="card-sub">Color, clarity, smell</div>
        </div>
        <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
      </a>
      <a class="card" href="diagnose-plants.html">
        <div class="tile">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M24 42V22"/><path d="M24 24c0-8-6-12-14-12 0 8 6 12 14 12z"/><path d="M24 20c0-7 6-11 14-11 0 7-6 11-14 11z"/></svg>
        </div>
        <div>
          <div class="card-label">My Plants</div>
          <div class="card-sub">Leaves, growth, algae</div>
        </div>
        <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
      </a>
    </div>
  </main>
</body>
</html>

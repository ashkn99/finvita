<!--
  Blog post template. Not wired into build.js yet - there's no blog content
  pipeline (see CLAUDE.md "Known gaps"). Mirrors result-template.html's
  token convention ({{TOKEN}}) so a future generator can drop straight in.
  Assumes posts live one level deep, e.g. public/blog/<slug>.html.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} - Aquarium Health Helper</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <meta property="og:title" content="{{TITLE}} - Aquarium Health Helper">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main class="page page-wide">
    <nav class="site-nav">
      <a class="logo" href="../index.html">finvita</a>
      <div class="nav-links" id="nav-links">
        <a href="../index.html#diagnose">Diagnose</a>
        <a href="../blog.html" class="active" aria-current="page">Blog</a>
        <a href="../about.html">About</a>
      </div>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </nav>

    <article>
      <div class="blog-meta">{{DATE}}</div>
      <h1 id="main-content">{{TITLE}}</h1>
      <div class="post-media">
        <img src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}" loading="eager">
      </div>
      <div class="prose">
        {{BODY}}
      </div>
    </article>

    <div class="post-cta">
      <div class="hero-badge">Not sure what's wrong?</div>
      <h2>Get a specific answer for your tank</h2>
      <p>Answer a few quick questions and we'll point you to the likely cause and what actually helps.</p>
      <a class="hero-cta" href="../index.html#diagnose">Start My Diagnosis</a>
    </div>

    <footer class="site-footer">
      <a href="../about.html">About</a>
      <a href="../privacy.html">Privacy</a>
      <a href="../contact.html">Contact</a>
      <a href="../disclosure.html">Disclosure</a>
    </footer>
  </main>
  <script src="../js/nav.js" defer></script>
</body>
</html>
